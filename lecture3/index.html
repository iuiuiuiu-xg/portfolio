<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>

     document.write("привет!");

<script src="js.js"></script> 
    <script>
        let yme = prompt('Ваше имя?');
        alert('Ваше имя: ' + yme);

        let a = prompt("число 1?");
        let b = prompt("число 2?");
        let c = Number(a) + Number(b);
        alert("Ответ: " + c);
    </script>
    
    <div class="task-block">
        <h3>Задание 7</h3>
        <script>
            for(let i = 1; i <= 10; i++) {
                document.write("<hr width='" + i * 10 + "%'>");
            }
        </script>
    </div>

    <div class="task-block">
        <h3>Задание 8</h3>
        <script>
            for(let i = 10; i >= 1; i--) {
                document.write("<hr width='" + i * 10 + "%'>");
            }
        </script>
    </div>


    <div class="task-block">
        <h3>Задание 9</h3>
        <script>
            let numTable = 5;
            for (let i = 1; i <= 9; i++) {
                document.write(i + " * " + numTable + " = " + (i * numTable) + "<br>");
            }
        </script>
    </div>

    <div class="task-block">
        <h3>Задание 10</h3>
        <table border="1" style="border-collapse: collapse;">
        <script>
            for (let i = 1; i <= 100; i++) {
                document.write("<tr>");
                document.write("<td>" + i + "</td>");
                document.write("</tr>");
            }
        </script>
        </table>
    </div>

    <div class="task-block">
        <h3>Задание 11</h3>
        <script>
            document.write("<table border='1' style='border-collapse: collapse;'>");
            for (let i = 1; i <= 100; i++) {
                document.write("<tr>");
                document.write("<td>" + i + "</td>");
                document.write("</tr>");
            }
            document.write("</table>");
        </script>
    </div>

    <div class="task-block">

        <script>
            let num = prompt("Введите число для таблицы умножения:");
            if (num !== null) { 
                let i = 1;
                while (i <= 10) {
                    document.write(num + " x " + i + " = " + (num * i) + "<br>");
                    i++;
                }
            } else {
                document.write("Вы отменили ввод.");
            }
        </script>
    </div>

    <div class="task-block">

        <script>
    
            let n1 = prompt("Число 1:");
            let n2 = prompt("Число 2:");

            let result = multiply(n1, n2);
            alert("Результат умножения: " + result);

            function multiply(a, b) {
                let res = Number(a) * Number(b);
                return res;
            }
        </script>
    </div>

    <div class="task-block">
        <h3>Задание 14</h3>
        <script>

            let randA = Math.floor(1 + (10 - 1 + 1) * Math.random());
            let randB = Math.floor(1 + (10 - 1 + 1) * Math.random());
            
            let correctAnswer = randA + randB;

            let userAnswer = prompt(randA + " + " + randB + " = ?");

            if (userAnswer == correctAnswer) {
                alert("+"); 
            } else {
                alert("-"); 
            }
        </script>
    </div>
</body>
</html>

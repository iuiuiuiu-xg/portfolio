<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="css/style.css"/>
    <title>Задание 11</title>
  </head>
  <body>
    <div class="container">
      <title>Тест по информатике</title>
      <script>
        function check1() {
          if (document.test.q1.value == "4") document.test.r1.value = "верно";
          else document.test.r1.value = "не верно";
        }
        function check2() {
          if (document.test.q2.value == "5") document.test.r2.value = "верно";
          else document.test.r2.value = "не верно";
        }
        function check3() {
          if (document.test.q3.value.toLowerCase() == "html")
            document.test.r3.value = "верно";
          else document.test.r3.value = "не верно";
        }
        function grade() {
          var score = 0;

          if (document.test.q1.value == "4") score++;

          if (document.test.q2.value == "5") score++;

          if (document.test.q3.value.toLowerCase() == "html") score++;

          alert("Количество правильных ответов: " + score + " из 3");
        }
        function resetTest() {
          document.test.reset();
        }
      </script>
      <form name="test">
        <h2>Тест по информатике</h2>
        <input type="button" value="сброс" onclick="resetTest()"/>
        <p>1. Сколько будет 2 × 2?</p>
        <input type="text" name="q1"/>
        <input type="button" value="Проверить" onclick="check1()"/>
        <input type="text" name="r1" readonly/>
        <p>2. Сколько будет 10 : 2?</p>
        <input type="text" name="q2"/>
        <input type="button" value="Проверить" onclick="check2()"/>
        <input type="text" name="r2" readonly/>
        <p>3. Как называется язык разметки веб-страниц?</p>
        <input type="text" name="q3"/>
        <input type="button" value="Проверить" onclick="check3()"/>
        <input type="text" name="r3" readonly/>
        <p>Чтобы увидеть результаты работы, нажмите кнопку «оценка».</p>
        <input type="button" value="оценка" onclick="grade()"/>
      </form>
    </div>
  </body>
</html>
